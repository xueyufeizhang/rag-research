[project]
name = "rag-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "json-repair>=0.61.7",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "openai>=2.46.0",
    "python-dotenv>=1.2.2",
    "pyvis>=0.3.2",
    "tqdm>=4.69.0",
    "sentence-transformers>=3.0.0",
    "pysbd==0.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_research"]
